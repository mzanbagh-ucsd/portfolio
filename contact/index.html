<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mersad Zanbagh: Contact</title>
    <link rel="stylesheet" href="../style.css?v=contact-spacing">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <main>
        <section class="contact-intro">
            <h1>Get in touch</h1>
            <p>Let’s connect and build something meaningful.</p>
        </section>

        <div class="contact-layout">
            <aside class="contact-card">
                <a class="contact-email" href="mailto:mzanbagh@ucsd.edu">mzanbagh@ucsd.edu</a>
            </aside>

            <form class="contact-form" action="mailto:mzanbagh@ucsd.edu">
                <label for="contact-email">Your email</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="contact-subject">Subject</label>
                <input id="contact-subject" name="subject" type="text" placeholder="What would you like to discuss?" required>

                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="body" rows="6" placeholder="Write your message here..." required></textarea>

                <button type="submit">Send</button>
            </form>
        </div>
    </main>
</body>
</html>
